<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Morlaer.bzh</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            margin-top: 8px;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .bienvenue {
            text-align: center;
            margin-bottom: 50px;
        }

        .bienvenue h2 {
            font-size: 32px;
        }

        .manga {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Morlaer.bzh</h1>
        <p>Bro ar mangaioù e brezhoneg</p>
    </header>

    <main>

        <section class="bienvenue">
            <h2>Degemer mat war Morlaer !</h2>
            <p>
                Amañ e c'hellit lenn mangaioù ha webtoonoù troet e brezhoneg.
            </p>
        </section>

        <section>
            <h2>Mangaioù</h2>

            <div class="manga">
                <h3>Enklen</h3>
                <p>Ur manga e brezhoneg.</p>
            </div>

        </section>

    </main>

</body>
</html>
